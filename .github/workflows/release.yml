name: Release
on:
  push:
    tags: ['[0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Verify tag matches manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if (require('./manifest.json').version !== process.env.RELEASE_TAG) process.exit(1)"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:public
      - run: python3 scripts/package-release.py
      - name: Publish verified assets
        uses: softprops/action-gh-release@v3
        with:
          body_path: docs/RELEASE_${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            release/main.js
            release/manifest.json
            release/styles.css
            release/second-brain-evolution-${{ github.ref_name }}.zip
            release/SHA256SUMS.txt
